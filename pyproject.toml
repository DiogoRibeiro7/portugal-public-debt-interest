[tool.poetry]
name = "portugal-public-debt-interest"
version = "0.1.2"
description = "Reproducible analysis of Portugal's public-debt interest burden"
authors = ["Diogo"]
readme = "README.md"
packages = [
  { include = "pt_debt_interest", from = "src" },
  { include = "pt_debt", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pandas = ">=2.1,<3.0"
numpy = ">=1.26,<3.0"
httpx = ">=0.27,<1.0"
PyYAML = ">=6.0,<7.0"
pydantic = ">=2.7,<3.0"
typer = ">=0.12,<1.0"
matplotlib = ">=3.8,<4.0"
jinja2 = ">=3.1,<4.0"
tabulate = ">=0.9,<1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
pytest-cov = ">=5.0,<7.0"
ruff = ">=0.6,<1.0"
mypy = ">=1.11,<2.0"
pandas-stubs = ">=2.1,<3.0"
pre-commit = ">=3.8,<5.0"

[project]
name = "portugal-public-debt-interest"
version = "0.1.2"
description = "Reproducible analysis of Portugal's public-debt interest burden"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1,<3.0",
  "numpy>=1.26,<3.0",
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
  "pydantic>=2.7,<3.0",
  "typer>=0.12,<1.0",
  "matplotlib>=3.8,<4.0",
  "jinja2>=3.1,<4.0",
  "tabulate>=0.9,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "pandas-stubs>=2.1,<3.0",
  "pre-commit>=3.8,<5.0",
]

[project.scripts]
pt-debt = "pt_debt_interest.cli:app"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["pt_debt_interest", "nbtools"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]

[tool.coverage.run]
source = ["pt_debt_interest"]
branch = true
